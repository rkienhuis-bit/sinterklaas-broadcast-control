
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Broadcast Controller Listener</title>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>

  <script>
    const cfg = window.APP_CONFIG;
    const db = window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_ANON_KEY
    );

    let lastCommand = null;

    db.channel("broadcast-control")
      .on("postgres_changes", {
        event: "UPDATE",
        schema: "public",
        table: "broadcast_state",
        filter: "id=eq.1"
      }, (payload) => {
        const state = payload.new;

        if (state.command_id === lastCommand) return;
        lastCommand = state.command_id;

        if (state.mode === "special") {
          window.location.href =
            "/video-player.html?mode=special";
        }

        if (state.mode === "fireplace") {
          window.location.href =
            "/video-player.html?mode=fireplace";
        }
      })
      .subscribe();
  </script>
</body>
</html>
