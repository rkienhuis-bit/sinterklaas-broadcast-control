
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPEX Broadcast</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #broadcast-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      color: white;
      font-size: 14px;
      opacity: 0.7;
      z-index: 10;
    }
  </style>
</head>

<body>

  <video
    id="broadcast-video"
    autoplay
    muted
    playsinline
  ></video>

  <div id="status" style="display:none"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="config.js"></script>
  <script src="broadcast.js"></script>

</body>
</html>
