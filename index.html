
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPEX Broadcast</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #broadcast-image,
    #broadcast-video {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #broadcast-image.active,
    #broadcast-video.active {
      display: block;
    }

    #status {
      display: none;
    }
  </style>
</head>

<body>

  <img id="broadcast-image" alt="IPEX Broadcast">

  <video
    id="broadcast-video"
    autoplay
    muted
    playsinline
    loop
  ></video>

  <div id="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="broadcast.js"></script>

</body>
</html>
