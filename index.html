
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPEX Broadcast</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .media-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 0;
      transition: opacity 1000ms ease-in-out;
      pointer-events: none;
    }

    .media-layer.active {
      opacity: 1;
    }

    .media-layer img,
    .media-layer video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #status {
      display: none;
    }
  </style>
</head>

<body>

  <div id="layer-1" class="media-layer active">
    <img alt="IPEX Broadcast">
    <video muted playsinline loop></video>
  </div>

  <div id="layer-2" class="media-layer">
    <img alt="IPEX Broadcast">
    <video muted playsinline loop></video>
  </div>

  <div id="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="broadcast.js"></script>

</body>
</html>
