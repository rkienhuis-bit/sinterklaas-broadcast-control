
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Video redirect test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    #start {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    button {
      padding: 24px 48px;
      font-size: 28px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: black;
    }
  </style>
</head>

<body>
  <div id="start">
    <h1>Video wordt gestart...</h1>
    <button id="start-button">START VIDEO</button>
  </div>

  <script>
    const videoUrl =
      "https://www.dropbox.com/scl/fi/d634zzv3494pwo97ifgae/sinterhaard.mp4?rlkey=60h2u6v3s184l8sjlz6vsw7pr&raw=1";

    const button = document.getElementById("start-button");

    // Probeer automatisch door te schakelen.
    window.addEventListener("load", () => {
      setTimeout(() => {
        button.click();
      }, 1500);
    });

    button.addEventListener("click", () => {
      window.location.href = videoUrl;
    });
  </script>
</body>
</html>
