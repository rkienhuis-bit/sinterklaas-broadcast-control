
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Video fullscreen test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #start {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      font-size: 28px;
      padding: 24px 48px;
    }
  </style>
</head>

<body>
  <div id="start">
    <button id="start-button">START VIDEO</button>
  </div>

  <script>
    const videoUrl =
      "https://www.dropbox.com/scl/fi/d634zzv3494pwo97ifgae/sinterhaard.mp4?rlkey=60h2u6v3s184l8sjlz6vsw7pr&raw=1";

    const button = document.getElementById("start-button");

    async function startVideo() {
      try {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.log("Fullscreen niet toegestaan:", error);
      }

      window.location.href = videoUrl;
    }

    button.addEventListener("click", startVideo);

    window.addEventListener("load", () => {
      setTimeout(() => {
        button.click();
      }, 1500);
    });
  </script>
</body>
</html>
