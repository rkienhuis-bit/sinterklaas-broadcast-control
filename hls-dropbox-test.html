
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dropbox HLS-test</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
    }

    video {
      width: 100%;
      max-width: 1100px;
      max-height: 80vh;
      background: black;
    }

    #status {
      width: 100%;
      max-width: 1100px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>
<body>

  <video id="video" autoplay muted controls playsinline></video>
  <div id="status">HLS-stream wordt geladen...</div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>
    (() => {
      const video = document.getElementById('video');
      const status = document.getElementById('status');

      // Vercel-proxy naar het HLS-bestand op Dropbox
      const segmentUrl =
        'https://sinterklaas-broadcast-control.vercel.app/api/fireplace';

      // Byte-ranges van de 40 seconden durende testvideo
      const ranges = [
        '739780@0',
        '689584@739780',
        '533544@1429364',
        '529408@1962908',
        '599156@2492316',
        '505720@3091472',
        '516436@3597192',
        '607992@4113628',
        '558924@4721620',
        '537868@5280544'
      ];

      const playlistLines = [
        '#EXTM3U',
        '#EXT-X-VERSION:4',
        '#EXT-X-TARGETDURATION:4',
        '#EXT-X-MEDIA-SEQUENCE:0',
        '#EXT-X-PLAYLIST-TYPE:VOD'
      ];

      ranges.forEach((range) => {
        playlistLines.push('#EXTINF:4.000000,');
        playlistLines.push('#EXT-X-BYTERANGE:' + range);
        playlistLines.push(segmentUrl);
      });

      playlistLines.push('#EXT-X-ENDLIST');

      const playlistBlob = new Blob(
        [playlistLines.join('\n')],
        { type: 'application/vnd.apple.mpegurl' }
      );

      const playlistUrl = URL.createObjectURL(playlistBlob);

      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls();

        hls.on(Hls.Events.ERROR, (_event, data) => {
          if (data.fatal) {
            status.textContent =
              'HLS-fout: ' + data.type + ' — ' + data.details;
          }
        });

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          status.textContent = 'Playlist geladen. Video start...';

          video.play().catch((error) => {
            status.textContent =
              'Automatisch starten lukte niet: ' + error.message;
          });
        });

        hls.loadSource(playlistUrl);
        hls.attachMedia(video);

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = playlistUrl;

        video.addEventListener('loadedmetadata', () => {
          status.textContent = 'Playlist geladen. Video start...';
          video.play().catch((error) => {
            status.textContent =
              'Afspelen vereist een handmatige actie: ' + error.message;
          });
        }, { once: true });

      } else {
        status.textContent =
          'Deze browser ondersteunt geen HLS-playback.';
      }

      video.addEventListener('playing', () => {
        status.textContent =
          'Afspelen — testvideo via Dropbox en Vercel-proxy.';
      });

      video.addEventListener('error', () => {
        const mediaError = video.error;
        status.textContent =
          'Videofout' +
          (mediaError ? ' (code ' + mediaError.code + ')' : '') + '.';
      });

    })();
  </script>

</body>
</html>
