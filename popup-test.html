
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broadcast test</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #controller {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #video-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Achtergrondpagina voor de controller -->
  <iframe id="controller" src="/controller-listener.html"></iframe>

  <!-- Hier wordt de Dropbox-video geopend -->
  <iframe id="video-frame" allow="autoplay; fullscreen"></iframe>

  <script>
    const fireplaceUrl =
      "https://www.dropbox.com/scl/fi/d634zzv3494pwo97ifgae/sinterhaard.mp4?rlkey=60h2u6v3s184l8sjlz6vsw7pr&raw=1";

    window.addEventListener("load", () => {
      setTimeout(() => {
        window.location.href = fireplaceUrl;
      }, 1500);
    });
  </script>

</body>
</html>
